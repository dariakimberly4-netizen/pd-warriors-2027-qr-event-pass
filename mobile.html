<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PD Warriors 2027 QR Event Pass</title>
<link rel="stylesheet" href="responsive-v101.css?v=101">
</head>
<body data-build="101" data-screen="orbit">
<div class="toolbar">
  <span id="connection"></span>
  <button id="chooseStation" class="secondary"><span id="stationLabel">Choose station</span> ▾</button>
</div>

<main class="wrap">
  <div id="notice" role="status" hidden></div>

  <div id="orbitHome">
    <div class="stats">
      <div class="stat"><b id="total">0</b>Participants</div>
      <div class="stat"><b id="reg">0</b>Attendance</div>
      <div class="stat"><b id="snack">0</b>Snacks claimed</div>
      <div class="stat"><b id="lunch">0</b>Lunches claimed</div>
    </div>

    <nav class="poster-orbit" aria-label="Event modules">
      <svg class="poster-art poster-art-mobile" viewBox="0 0 1024 2030" preserveAspectRatio="none" aria-hidden="true">
        <svg x="0" y="0" width="1024" height="250" viewBox="0 0 1024 100" preserveAspectRatio="none">
          <image href="assets/event-portal.jpg?v=101" x="0" y="0" width="1024" height="1536"></image>
        </svg>
        <svg x="0" y="250" width="1024" height="1300" viewBox="0 100 1024 1300" preserveAspectRatio="none">
          <image href="assets/event-portal.jpg?v=101" x="0" y="0" width="1024" height="1536"></image>
        </svg>
        <svg x="0" y="1550" width="1024" height="480" viewBox="0 1400 1024 136" preserveAspectRatio="none">
          <image href="assets/event-portal.jpg?v=101" x="0" y="0" width="1024" height="1536"></image>
        </svg>
      </svg>
      <svg class="poster-art poster-art-desktop" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
        <rect x="0" y="0" width="1920" height="1080" fill="#fefcf0"></rect>
        <ellipse cx="-20" cy="-120" rx="580" ry="430" fill="#065034"></ellipse>
        <ellipse cx="-20" cy="-120" rx="530" ry="380" fill="#d8ad37"></ellipse>
        <ellipse cx="-20" cy="-120" rx="485" ry="335" fill="#fefcf0"></ellipse>
        <ellipse cx="1940" cy="-120" rx="580" ry="430" fill="#065034"></ellipse>
        <ellipse cx="1940" cy="-120" rx="530" ry="380" fill="#d8ad37"></ellipse>
        <ellipse cx="1940" cy="-120" rx="485" ry="335" fill="#fefcf0"></ellipse>
        <ellipse cx="-20" cy="1200" rx="640" ry="500" fill="#065034"></ellipse>
        <ellipse cx="-20" cy="1200" rx="585" ry="450" fill="#d8ad37"></ellipse>
        <ellipse cx="-20" cy="1200" rx="535" ry="405" fill="#fefcf0"></ellipse>
        <ellipse cx="1940" cy="1200" rx="640" ry="500" fill="#065034"></ellipse>
        <ellipse cx="1940" cy="1200" rx="585" ry="450" fill="#d8ad37"></ellipse>
        <ellipse cx="1940" cy="1200" rx="535" ry="405" fill="#fefcf0"></ellipse>
        <line x1="60" y1="270" x2="555" y2="270" stroke="#d8ad37" stroke-width="2"></line>
        <line x1="1365" y1="270" x2="1860" y2="270" stroke="#d8ad37" stroke-width="2"></line>
        <line x1="60" y1="810" x2="555" y2="810" stroke="#d8ad37" stroke-width="2"></line>
        <line x1="1365" y1="810" x2="1860" y2="810" stroke="#d8ad37" stroke-width="2"></line>
        <image href="assets/event-portal.jpg?v=101" x="600" y="0" width="720" height="1080"></image>
      </svg>
      <button type="button" class="poster-hotspot" data-module="registration" aria-label="Attendance" title="Attendance" style="--mx:49.90234%;--my:29.11330%;--dx:49.96338%;--dy:28.71094%"><span class="sr-only">Attendance</span></button>
      <button type="button" class="poster-hotspot" data-module="walkin" aria-label="Walk-in" title="Walk-in" style="--mx:75%;--my:34.08867%;--dx:59.375%;--dy:35.28646%"><span class="sr-only">Walk-in</span></button>
      <button type="button" class="poster-hotspot" data-module="snack" aria-label="Snack" title="Snack" style="--mx:85.9375%;--my:45.81281%;--dx:63.47656%;--dy:50.78125%"><span class="sr-only">Snack</span></button>
      <button type="button" class="poster-hotspot" data-module="lunch" aria-label="Lunch" title="Lunch" style="--mx:75.48828%;--my:57.73399%;--dx:59.55811%;--dy:66.53646%"><span class="sr-only">Lunch</span></button>
      <button type="button" class="poster-hotspot" data-module="raffle" aria-label="Raffle" title="Raffle" style="--mx:49.90234%;--my:63.25123%;--dx:49.96338%;--dy:73.82812%"><span class="sr-only">Raffle</span></button>
      <button type="button" class="poster-hotspot" data-module="scan" aria-label="QR scan" title="QR scan" style="--mx:24.12109%;--my:57.78325%;--dx:40.29541%;--dy:66.60156%"><span class="sr-only">QR scan</span></button>
      <button type="button" class="poster-hotspot" data-module="attendees" aria-label="Roster" title="Roster" style="--mx:13.76953%;--my:45.81281%;--dx:36.41357%;--dy:50.78125%"><span class="sr-only">Roster</span></button>
      <button type="button" class="poster-hotspot" data-module="report" aria-label="Reports & setup" title="Reports & setup" style="--mx:24.41406%;--my:34.08867%;--dx:40.40527%;--dy:35.28646%"><span class="sr-only">Reports & setup</span></button>
    </nav>
  </div>

  <section id="content" hidden>
    <button id="back">← Back to orbit</button>
    <h2 id="viewTitle"></h2>
    <div id="view"></div>
  </section>
</main>

<dialog id="stationDialog">
  <form id="stationForm">
    <p class="module-eyebrow">STAFF WORKSPACE</p>
    <h2>Choose this device’s station</h2>
    <p>Use one device for each station throughout the event.</p>
    <label class="choice"><input type="radio" name="station" value="registration" required> Registration & raffle <small>Donna / registration staff</small></label>
    <label class="choice"><input type="radio" name="station" value="snack"> Snack claims</label>
    <label class="choice"><input type="radio" name="station" value="lunch"> Lunch claims</label>
    <button>Open station</button>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/qrcode-utf8.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="app.js?v=101"></script>
</body>
</html>
