<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PD Warriors 2027 QR Event Pass</title>
<link rel="stylesheet" href="responsive-v102.css?v=102">
</head>
<body data-build="102" data-screen="orbit">
<div class="toolbar">
  <span id="connection"></span>
  <button id="chooseStation" class="secondary"><span id="stationLabel">Choose station</span> ▾</button>
</div>

<main class="wrap">
  <div id="notice" role="status" hidden></div>

  <div id="orbitHome">
    <div class="stats">
      <div class="stat"><b id="total">0</b>Participants</div>
      <div class="stat"><b id="reg">0</b>Attendance</div>
      <div class="stat"><b id="snack">0</b>Snacks claimed</div>
      <div class="stat"><b id="lunch">0</b>Lunches claimed</div>
    </div>

    <nav class="poster-orbit" aria-label="Event modules">
      <img src="assets/event-portal.jpg?v=102" width="1024" height="1536" alt="Parkinson’s Disease Warriors Philippines — Get Together 2027 event portal. One QR for attendance, snack, lunch and raffle.">
      <button type="button" class="poster-hotspot" data-module="registration" aria-label="Attendance" title="Attendance" style="--x:49.90234%;--y:28.71094%"><span class="sr-only">Attendance</span></button>
      <button type="button" class="poster-hotspot" data-module="walkin" aria-label="Walk-in" title="Walk-in" style="--x:75%;--y:35.28646%"><span class="sr-only">Walk-in</span></button>
      <button type="button" class="poster-hotspot" data-module="snack" aria-label="Snack" title="Snack" style="--x:85.9375%;--y:50.78125%"><span class="sr-only">Snack</span></button>
      <button type="button" class="poster-hotspot" data-module="lunch" aria-label="Lunch" title="Lunch" style="--x:75.48828%;--y:66.53646%"><span class="sr-only">Lunch</span></button>
      <button type="button" class="poster-hotspot" data-module="raffle" aria-label="Raffle" title="Raffle" style="--x:49.90234%;--y:73.82812%"><span class="sr-only">Raffle</span></button>
      <button type="button" class="poster-hotspot" data-module="scan" aria-label="QR scan" title="QR scan" style="--x:24.12109%;--y:66.60156%"><span class="sr-only">QR scan</span></button>
      <button type="button" class="poster-hotspot" data-module="attendees" aria-label="Roster" title="Roster" style="--x:13.76953%;--y:50.78125%"><span class="sr-only">Roster</span></button>
      <button type="button" class="poster-hotspot" data-module="report" aria-label="Reports & setup" title="Reports & setup" style="--x:24.41406%;--y:35.28646%"><span class="sr-only">Reports & setup</span></button>
    </nav>
  </div>

  <section id="content" hidden>
    <button id="back">← Back to orbit</button>
    <h2 id="viewTitle"></h2>
    <div id="view"></div>
  </section>
</main>

<dialog id="stationDialog">
  <form id="stationForm">
    <p class="module-eyebrow">STAFF WORKSPACE</p>
    <h2>Choose this device’s station</h2>
    <p>Use one device for each station throughout the event.</p>
    <label class="choice"><input type="radio" name="station" value="registration" required> Registration & raffle <small>Donna / registration staff</small></label>
    <label class="choice"><input type="radio" name="station" value="snack"> Snack claims</label>
    <label class="choice"><input type="radio" name="station" value="lunch"> Lunch claims</label>
    <button>Open station</button>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/qrcode-utf8.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="app.js?v=102"></script>
</body>
</html>
